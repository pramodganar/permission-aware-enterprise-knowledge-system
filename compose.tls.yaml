# TLS in front of the UI and the API, on top of compose.yaml (docs/deployment.md#tls):
#
#   docker compose -f compose.yaml -f compose.tls.yaml up -d --build --wait
#
# The proxy is the only service published beyond this machine: the UI and the
# API stay on 127.0.0.1 and plain HTTP, reached from outside only through it.
# SITE_ADDRESS in .env is the name people use; HTTPS_PORT and HTTP_PORT move
# the ports.

services:
  proxy:
    # Exact version and digest, like the Python image the others are built on.
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    depends_on:
      api: { condition: service_healthy }
      ui: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    # Only what it takes to listen on 80 and 443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }
    ports:
      - "${HTTPS_PORT:-443}:443"
      # Redirects to HTTPS, and answers Let's Encrypt's checks.
      - "${HTTP_PORT:-80}:80"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and their keys.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
