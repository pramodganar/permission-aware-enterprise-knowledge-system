# Build both images and run them, alone and as the Compose stack, when
# anything that goes into them changes, or by hand (docs/ci.md). About five
# minutes, most of it building the images, so it doesn't run on every push.

name: Docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - compose.tls.yaml
      - deploy/**
      - requirements.txt
      - requirements-ui.txt
      - requirements-dev.txt
      - pyproject.toml
      - app/**
      - scripts/**
      - ui/**
      - data/acmecorp/**
      - tests/docker/**
      - tests/conftest.py
      - tests/dockertools.py
      - tests/imagesettings.py
      - .github/workflows/docker.yml
  # The same paths: a test keeps them so.
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - compose.tls.yaml
      - deploy/**
      - requirements.txt
      - requirements-ui.txt
      - requirements-dev.txt
      - pyproject.toml
      - app/**
      - scripts/**
      - ui/**
      - data/acmecorp/**
      - tests/docker/**
      - tests/conftest.py
      - tests/dockertools.py
      - tests/imagesettings.py
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Images and the stack
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        # The tests' own settings import the service, so they need it too.
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          python -m pip install -r requirements-dev.txt

      - name: Images and the stack
        run: pytest -m docker tests/docker
