[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
# Tests marked "model" load the real embedding model, which takes about half a
# minute. They are left out of a normal run. Run them with: pytest -m model
addopts = "--strict-markers -m 'not model'"
markers = ["model: loads the real embedding model (slow, needs the model downloaded)"]
# A warning usually means a test is doing something it shouldn't.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "B",   # likely bugs
    "UP",  # outdated syntax
    "SIM", # simplifications
    "C4",  # comprehensions
    "S",   # security checks (bandit rules)
    "RUF", # ruff's own rules
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, contain fake passwords and tokens, and use unusual
# characters on purpose.
"tests/**" = ["S101", "S105", "S106", "RUF001"]

[tool.mypy]
python_version = "3.11"
files = ["app", "scripts", "tests"]
mypy_path = "tests"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# FAISS ships no type information.
module = ["faiss"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "acmecorp", "testapp", "files", "fakes"]
